<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锦鲤未离的下载库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }
        
        body {
            background: #ffffff;
            padding: 20px 14px;
        }
        
        .mind {
            max-width: 720px;
            margin: 0 auto;
        }
        
        .row {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            margin: 4px 0;
        }
        
        .vert {
            width: 2px;
            background: #888;
            height: 26px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .vert-2 {
            width: 2px;
            background: #aaa;
            height: 22px;
            margin-left: 16px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        
        .vert-3 {
            width: 2px;
            background: #ccc;
            height: 20px;
            margin-left: 32px;
            margin-right: 8px;
            flex-shrink: 0;
        }
        /* 一级标题 蓝色文件夹 */
        
        .level-1 {
            font-size: 16px;
            font-weight: 700;
            color: #1f3a8f;
        }
        
        .folder-icon-l1 {
            width: 26px;
            height: 26px;
            margin-right: 5px;
            flex-shrink: 0;
        }
        /* 二级标题 灰色文件夹 */
        
        .level-2 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .folder-icon-l2 {
            width: 22px;
            height: 22px;
            margin-right: 5px;
            flex-shrink: 0;
        }
        /* 三级条目 小文件图标 */
        
        .level-3 {
            font-size: 13px;
            font-weight: 400;
            color: #444;
        }
        
        .file-icon-l3 {
            width: 18px;
            height: 18px;
            margin-right: 4px;
            flex-shrink: 0;
        }
        
        a {
            text-decoration: none;
            font-size: 13px;
            margin: 0 4px;
        }
        
        a.black {
            color: #000;
        }
        
        a.red {
            color: #dd2222;
        }
        
        a.blue {
            color: #0044dd;
        }
        
        a.green {
            color: #008833;
        }
        
        a.zip {
            color: #6f42c1;
        }
        
        a.rar {
            color: #cd6600;
        }
        
        a.ttf {
            color: #0077aa;
        }
    </style>
</head>
