        function getResult() {
            return getXml2(editorUi.editor.getGraphXml());

        function getXml2(a, b) {
            var c = "";
            if (a != null) {
                c = a.xml;
                c = c == null ? a.outerHTML ? a.outerHTML : (new XMLSerializer).serializeToString(a) : c.replace(/\r\n\t[\t]*/g, "").replace(/>\r\n/g, ">").replace(/\r\n/g, "\n")
            }

        }
        function setResult(xmlstr) {
            var docEle = xmlfromstring(xmlstr);

            editorUi.editor.undoManager.clear();

        function getFullDesc() {
            var graph = editorUi.editor.graph;
            var border = 1;
            var scale = 1;
            var bounds = graph.getGraphBounds();
            var imgExport = new mxImageExport();

            // New image export
            var xmlDoc = mxUtils.createXmlDocument();
            var root = xmlDoc.createElement('output');
            xmlDoc.appendChild(root);
            var xmlCanvas = new mxXmlCanvas2D(root);

            // Render graph
            xmlCanvas.scale(scale);
            xmlCanvas.translate(Math.floor(-bounds.x * scale) + border, Math.floor(-bounds.y * scale) + border);
            imgExport.drawState(graph.getView().getState(graph.model.root), xmlCanvas);

            var xml = mxUtils.getXml(root);
            return xml;
        }
        function convertToFullDesc(xmlstr) {
            setResult(xmlstr);
            return getFullDesc();
