<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>全能电子签名生成器｜透明PNG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,‑apple‑system,BlinkMacSystemFont,"Segoe UI",Roboto}
body{padding:18px;max‑width:820px;margin:0 auto;background:#f4f6f8;color:#222}
h3{margin‑bottom:14px}
.wrap‑canvas{position:relative;border:2px solid #aaa;border‑radius:8px;overflow:hidden;touch‑action:none;user‑select:none;background:#ffffff}
#sigCanvas{display:block}
.guide‑line{position:absolute;left:0;right:0;height:1px;background:#cccccc80;pointer‑events:none}
.ctrl‑row{margin‑top:14px;display:flex;flex‑wrap:wrap;gap:12px;align‑items:center}
.group{background:#fff;padding:10px 12px;border‑radius:8px;border:1px solid #ddd}
label{font‑size:14px;margin‑right:6px}
button{padding:8px 14px;border:none;border‑radius:6px;cursor:pointer;font‑size:14px}
.btn‑primary{background:#2563eb;color:#fff}
.btn‑warn{background:#f59e0b;color:#fff}
.btn‑danger{background:#ef4444;color:#fff}
.btn‑gray{background:#9ca3af;color:#fff}
input[type="range"]{width:120px}
input[type="file"]{display:none}
.tip{font‑size:13px;color:#555;margin‑top:8px}
.sig‑list{margin‑top:12px;display:flex;gap:8px;flex‑wrap:wrap}
.sig‑item{border:1px solid #bbb;padding:4px;border‑radius:4px;cursor:pointer;background:#fff}
</style>
</head>
<body>
<h3>电子签名工具（导出透明PNG）</h3>

<div class="wrap‑canvas" id="canvasWrap">
  <div id="guideContainer"></div>
  <canvas id="sigCanvas"></canvas>
</div>

<div class="ctrl‑row">
  <div class="group">
    <label>笔迹粗细:</label>
    <input id="lineWidthSlider" type="range" min="1" max="12" value="4">
    <span id="lwVal">4</span>
  </div>
  <div class="group">
    <label>颜色:</label>
    <select id="colorSel">
      <option value="#000000">黑色</option>
      <option value="#003399">蓝色</option>
      <option value="#cc0000">红色</option>
    </select>
  </div>
  <div class="group">
    <label>画布:</label>
    <select id="sizeSel">
      <option value="600,220">Word(600×220)</option>
      <option value="450,160">PDF小签名(450×160)</option>
      <option value="800,300">大尺寸(800×300)</option>
    </select>
  </div>
</div>

<div class="ctrl‑row">
  <button id="undoBtn" class="btn‑gray">↩撤销</button>
  <button id="clearBtn" class="btn‑danger">清空画布</button>
  <button id="saveRawBtn" class="btn‑primary">保存原图PNG</button>
  <button id="saveCropBtn" class="btn‑primary">保存【自动裁剪】PNG</button>
  <button id="rotateLeft" class="btn‑warn">↺‑2°</button>
  <button id="rotateRight" class="btn‑warn">↻+2°</button>
</div>

<div class="ctrl‑row">
  <button id="importBtn">导入签名图片</button>
  <input type="file" id="fileInput" accept="image/*">
  <button id="toggleGuide">切换参考横线</button>
  <button id="storeSig">保存当前签名到本地</button>
</div>

<div class="tip">💡鼠标/手指书写；参考线仅做辅助，导出图片不会带线；多签名会保存在浏览器本地</div>
<div class="sig‑list" id="sigList"></div>

<script>
const canvas = document.getElementById('sigCanvas');
const ctx = canvas.getContext('2d');
const guideContainer = document.getElementById('guideContainer');

let baseW=600,baseH=220;
canvas.width=baseW; canvas.height=baseH;

let drawing=false;
let lastX=0,lastY=0;
let lineWidth=4;
let strokeColor="#000000";
let showGuide=true;
let rotateDeg=0;
let history=[];
let historyIndex=-1;

// 保存画布快照用于撤销
function saveSnapshot(){
  if(historyIndex < history.length‑1){
    history.length=historyIndex+1;
  }
  history.push(canvas.toDataURL('image/png'));
  historyIndex=history.length‑1;
}

function restoreSnapshot(dataUrl){
  const img=new Image();
  img.onload=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
  }
  img.src=dataUrl;
}

//坐标获取
function getPos(e){
  const rect=canvas.getBoundingClientRect();
  if(e.touches){
    return {x:e.touches[0].clientX‑rect.left,y:e.touches[0].clientY‑rect.top}
  }else{
    return {x:e.offsetX,y:e.offsetY}
  }
}

function startDraw(e){
  e.preventDefault();
  drawing=true;
  saveSnapshot();
  const p=getPos(e);
  lastX=p.x;lastY=p.y;
}
function draw(e){
  if(!drawing)return;
  e.preventDefault();
  const p=getPos(e);
  ctx.beginPath();
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.lineWidth=lineWidth;
  ctx.strokeStyle=strokeColor;
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  lastX=p.x;lastY=p.y;
}
function stopDraw(){drawing=false;}

canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',stopDraw);
canvas.addEventListener('mouseleave',stopDraw);
canvas.addEventListener('touchstart',startDraw,{passive:false});
canvas.addEventListener('touchmove',draw,{passive:false});
canvas.addEventListener('touchend',stopDraw);

//撤销
document.getElementById('undoBtn').onclick=()=>{
  if(historyIndex>0){
    historyIndex‑=1;
    restoreSnapshot(history[historyIndex]);
  }
}

//清空
document.getElementById('clearBtn').onclick=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  history=[]
