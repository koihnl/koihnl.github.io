<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子签名生成器（透明PNG）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:16px;background:#eee;max-width:700px;margin:0 auto}
h3{margin-bottom:12px;color:#222}
#canvasWrap{border:2px solid #999;background:transparent;border-radius:6px;overflow:hidden;touch-action:none;user-select:none}
#sigCanvas{display:block}
.btns{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
button{padding:10px 18px;font-size:15px;border:none;border-radius:6px;cursor:pointer}
#saveBtn{background:#2563eb;color:white}
#clearBtn{background:#aaa;color:#fff}
.tip{margin-top:10px;font-size:13px;color:#555}
</style>
</head>
<body>
<h3>电子签名（导出透明PNG）</h3>
<div id="canvasWrap">
<canvas id="sigCanvas"></canvas>
</div>
<div class="btns">
<button id="saveBtn">保存签名图片</button>
<button id="clearBtn">清空重写</button>
</div>
<div class="tip">📝鼠标/手指书写；导出为透明PNG，可直接粘贴进Word/WPS文档</div>

<script>
const canvas = document.getElementById('sigCanvas');
const ctx = canvas.getContext('2d');
// 设置画布尺寸
const w = 600;
const h = 220;
canvas.width = w;
canvas.height = h;

let drawing = false;
let lastX = 0, lastY = 0;
ctx.lineWidth = 4;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';
ctx.strokeStyle = '#000000';

// 获取坐标
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  if(e.touches){
    return {x:e.touches[0].clientX - rect.left, y:e.touches[0].clientY - rect.top}
  }else{
    return {x:e.offsetX, y:e.offsetY}
  }
}

function startDraw(e){
  e.preventDefault();
  drawing=true;
  const p = getPos(e);
  lastX=p.x;lastY=p.y;
}
function draw(e){
  if(!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX,lastY);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  lastX=p.x;lastY=p.y;
}
function stopDraw(){ drawing=false; }

//鼠标事件
canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',draw);
canvas.addEventListener('mouseup',stopDraw);
canvas.addEventListener('mouseleave',stopDraw);
//触屏手机平板
canvas.addEventListener('touchstart',startDraw,{passive:false});
canvas.addEventListener('touchmove',draw,{passive:false});
canvas.addEventListener('touchend',stopDraw);

//清空
document.getElementById('clearBtn').onclick=()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

//保存：输出透明背景PNG
document.getElementById('saveBtn').onclick=()=>{
  const link = document.createElement('a');
  link.download = "电子签名.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>
</body>
</html>
