<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>待办记录工作台 | 锦鲤未离</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232c3e50'/%3E%3Cpath d='M30 52l15 16 28-34' stroke='%23ffa500' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{ --bg:#f2f5f9;--card:#fff;--ink:#2c3e50;--ink-2:#5f7184;--ink-3:#9aa8b8; --line:#e6ebf1;--accent:#ffa500;--accent-deep:#ee8d00;--accent-soft:#fff3da; --work:#3478d9;--work-soft:#e9f1fd;--personal:#22a447;--personal-soft:#e6f6ea; --meeting:#3478d9;--meeting-soft:#e9f1fd;--dacument:#d95134;--dacument-soft:#fdeeea; --document:#28a745;--document-soft:#e6f6ea;--other:#868e96;--other-soft:#f0f2f5; --danger:#ff4757;--danger-soft:#ffe9ec;--high:#ff4757;--medium:#f08c00;--low:#8b98a8; --radius:12px;--shadow:0 1px 2px rgba(44,62,80,.05),0 4px 14px rgba(44,62,80,.06);}
html{-webkit-text-size-adjust:100%}
body{font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:66px 14px 128px}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:14px}
/* ===== 顶部栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:998;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 1px 10px rgba(44,62,80,.07);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.date-area{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#datePicker{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;color:var(--ink);background:#fff;cursor:pointer}
.today-pill{display:none;align-items:center;background:var(--accent-soft);color:var(--accent-deep);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;transition:transform .15s,opacity .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);opacity:.92}
.btn:active{transform:translateY(0) scale(.97)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);border-color:#d3dbe4}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(255,165,0,.35)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 3px 10px rgba(255,71,87,.3)}
/* ===== 内容区 ===== */
.container{max-width:860px;margin:0 auto}
/* 统计面板 */
.stats-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:10px}
.stats-nums{display:flex;align-items:center}
.stat{flex:1;text-align:center;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:18%;height:64%;width:1px;background:var(--line)}
.stat b{display:block;font-size:20px;line-height:1.15;letter-spacing:.4px}
.stat span{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:block}
.stat.total b{color:var(--ink)}
.stat.pending b{color:var(--accent-deep)}
.stat.done b{color:var(--personal)}
.stat.records b{color:var(--meeting)}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.progress{flex:1;height:6px;border-radius:99px;background:#edf1f6;overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb52e,var(--accent-deep));transition:width .45s ease}
.progress-text{font-size:12.5px;font-weight:700;color:var(--ink-2);min-width:34px;text-align:right}
.overdue-pill{display:none;background:var(--danger-soft);color:var(--danger);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
/* ===== 模块卡片 ===== */
.module{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 13px;margin-bottom:10px}
.module-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.module-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px}
.module-icon{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.module-icon.todo{background:var(--accent)}
.module-icon.record{background:var(--meeting)}
.module-icon.dm{background:var(--ink-2)}
.chevron{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex:none;transition:transform .2s,background .15s}
.chevron:hover{background:#eef2f7;color:var(--ink)}
.module.collapsed .chevron{transform:rotate(-90deg)}
.module-body{display:block}
.module.collapsed .module-body{display:none}
.head-filters{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
/* 筛选药丸 */
.pills{display:inline-flex;background:#eef2f7;border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.pills button{padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2);border-radius:6px;transition:all .18s}
.pills button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(44,62,80,.14)}
/* 子分区（公事 / 私事） */
.sub-block{padding:5px 0 0}
.sub-block + .sub-block{border-top:1px dashed var(--line);margin-top:5px;padding-top:8px}
.sub-head{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.sub-head h3{font-size:14px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.work{background:var(--work)}
.dot.personal{background:var(--personal)}
.count-pill{background:#f0f3f8;color:var(--ink-2);font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px}
/* ===== 待办条目 ===== */
.item{display:flex;align-items:flex-start;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);animation:itemIn .28s ease}
.item:last-child{border-bottom:none}
@keyframes itemIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid #c6d0db;display:flex;align-items:center;justify-content:center;color:transparent;transition:all .2s}
.check svg{opacity:0;transform:scale(.5);transition:all .2s}
.item.done .check{background:var(--personal);border-color:var(--personal);color:#fff}
.item.done .check svg{opacity:1;transform:scale(1)}
.check:hover{border-color:var(--personal)}
.item-main{flex:1;min-width:0}
.item-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.meta-time{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;line-height:1.5}
.badge.prio.high{background:var(--danger-soft);color:var(--high)}
.badge.prio.medium{background:var(--accent-soft);color:var(--accent-deep)}
.badge.prio.low{background:#eef1f5;color:var(--low)}
.badge.due{background:#eef1f5;color:var(--ink-2)}
.badge.due.overdue{background:var(--danger-soft);color:var(--high);font-weight:700}
.badge.pin{background:var(--meeting-soft);color:var(--meeting)}
.badge.star{background:var(--accent-soft);color:var(--accent-deep)}
.item-content{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;transition:color .2s}
.item.done .item-content{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(95,113,132,.5)}
/* ===== 记录条目 ===== */
.rec-item{display:flex;align-items:flex-start;gap:10px;padding:6px 2px 6px 10px;border-bottom:1px solid var(--line);border-left:4px solid var(--other);animation:itemIn .28s ease}
.rec-item.type-meeting{border-left-color:var(--meeting)}
.rec-item.type-dacument{border-left-color:var(--dacument)}
.rec-item.type-document{border-left-color:var(--document)}
.rec-item.type-other{border-left-color:var(--other)}
.rec-item:last-child{border-bottom:none}
.rec-main{flex:1;min-width:0}
.rec-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:1px}
.rec-type-badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;line-height:1.5}
.rec-type-badge.meeting{background:var(--meeting-soft);color:var(--meeting)}
.rec-type-badge.dacument{background:var(--dacument-soft);color:var(--dacument)}
.rec-type-badge.document{background:var(--document-soft);color:var(--document)}
.rec-type-badge.other{background:var(--other-soft);color:var(--other)}
.rec-content{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
/* 条目操作 */
.item-actions{flex:none;display:flex;gap:1px;flex-wrap:wrap;opacity:.4;transition:opacity .2s}
.item:hover .item-actions,.rec-item:hover .item-actions{opacity:1}
.icon-btn{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);transition:all .15s}
.icon-btn:hover{background:#eef2f7;color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn.on{color:var(--accent-deep);background:var(--accent-soft)}
.icon-btn.on-pin{color:var(--meeting);background:var(--meeting-soft)}
.dm-item .item-actions{opacity:1}
.dm-item .item-actions .ghost{padding:3px 9px;font-size:12px}
#dmModule{scroll-margin-top:70px}
#dmHead{cursor:default}
.list-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;color:var(--ink-3);font-size:13px}
/* 模块底部操作 */
.section-actions{display:flex;justify-content:flex-end;gap:6px;padding-top:8px;border-top:1px dashed var(--line);margin-top:2px}
.ghost{font-size:12.5px;font-weight:600;color:var(--ink-2);background:#f4f7fb;border:1px solid var(--line);border-radius:7px;padding:4px 11px;transition:all .15s}
.ghost:hover{color:var(--ink);border-color:#c9d4e0}
.ghost.danger-text:hover{color:var(--danger);border-color:#ffc4ca;background:var(--danger-soft)}
/* ===== 数据管理 ===== */
.storage-block{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.storage-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-weight:700;margin-bottom:6px}
.storage-sub{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.5}
.storage-bar-fill.ok{background:linear-gradient(90deg,#3ddc84,#22a447)}
.storage-bar-fill.warn{background:linear-gradient(90deg,#ffc24b,#f08c00)}
.storage-bar-fill.danger{background:linear-gradient(90deg,#ff7a7a,#ff4757)}
.dm-panel{display:none}
.dm-panel.active{display:block}
.dm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.dm-head h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;margin-right:auto}
/* 日历 */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.cal-title{font-size:14.5px;font-weight:700;margin:0 4px}
.cal-head .spacer{flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{min-height:76px;text-align:left;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink-2);position:relative;display:flex;flex-direction:column;align-items:flex-start}
.cal-cell.week{min-height:0;display:block;text-align:center;padding:2px 0;font-size:12px;color:var(--ink-3);font-weight:700}
.cal-cell.day{cursor:pointer;background:#fff;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.cal-cell.day:hover{border-color:var(--accent)}
.cal-cell.day.today .cal-dnum{color:var(--accent-deep);font-weight:700}
.cal-cell.day.selected{border:2px solid var(--accent);box-shadow:0 0 0 1px var(--accent);padding:7px 9px}
.cal-cell.empty{visibility:hidden}
.cal-dnum{font-size:15px;font-weight:600;color:var(--ink);line-height:1.2}
.cal-counts{display:flex;gap:8px;margin-top:6px}
.cal-cnt{font-size:12px;font-weight:700;line-height:1.2}
.cal-cnt.todo{color:var(--work)}
.cal-cnt.rec{color:var(--accent-deep)}
.cal-hint{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center}
/* 数据管理列表 */
.dm-item{display:flex;align-items:flex-start;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.dm-item:last-child{border-bottom:none}
.dm-main{flex:1;min-width:0}
.dm-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;font-size:12px;color:var(--ink-3)}
.dm-content{font-size:13.5px;line-height:1.55;color:var(--ink);word-break:break-word;white-space:pre-wrap}
.dm-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;color:var(--ink-3);font-size:13px}
.badge.lg-todo{background:var(--work-soft);color:var(--work)}
.badge.lg-record{background:var(--personal-soft);color:var(--personal)}
.badge.lg-draft{background:var(--accent-soft);color:var(--accent-deep)}
.badge.lg-recycle{background:var(--danger-soft);color:var(--danger)}
.badge.lg-system{background:#eef1f5;color:var(--ink-2)}
/* 全空状态 */
.empty-all{display:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 20px;text-align:center;margin-bottom:10px}
.empty-icon{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center}
.empty-title{font-size:16px;font-weight:700;margin-bottom:5px}
.empty-sub{font-size:13.5px;color:var(--ink-3);line-height:1.6}
/* 页脚 */
.foot{display:flex;align-items:center;justify-content:flex-start;gap:12px;flex-wrap:wrap;margin:6px 0 16px;color:var(--ink-3);font-size:12px}
/* ===== 悬浮新增按钮 ===== */
.fab-row{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;gap:10px}
.fab{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:14px;font-weight:700;padding:10px 22px;border-radius:999px;transition:transform .18s,box-shadow .18s}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.97)}
.fab svg{width:15px;height:15px}
.fab-record{background:var(--meeting);box-shadow:0 6px 18px rgba(52,120,217,.4)}
.fab-record:hover{box-shadow:0 10px 22px rgba(52,120,217,.46)}
.fab-todo{background:var(--accent);box-shadow:0 6px 18px rgba(255,165,0,.4)}
.fab-todo:hover{box-shadow:0 10px 22px rgba(255,165,0,.46)}
/* ===== 弹窗 ===== */
.mask-layer{position:fixed;inset:0;background:rgba(30,42,56,.45);z-index:3000;display:none;align-items:flex-end;opacity:0;transition:opacity .25s ease}
.mask-layer.show{display:flex;opacity:1}
.popup-box{width:100%;max-width:680px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px 24px;box-sizing:border-box;max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.22,.9,.3,1)}
.mask-layer.show .popup-box{transform:translateY(0)}
.pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pop-head h3{font-size:17px;font-weight:700}
.pop-close{width:30px;height:30px;border-radius:50%;background:#f0f3f8;color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:all .15s}
.pop-close:hover{background:#e4eaf1;color:var(--ink)}
.pop-field{margin-bottom:12px}
.pop-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.seg.big{width:100%;display:flex}
.seg.big button{flex:1;padding:9px 0;font-size:14px;text-align:center}
.seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px}
.seg button{padding:6px 13px;font-size:13px;font-weight:600;color:var(--ink-2);border-radius:7px;transition:all .18s}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(44,62,80,.14)}
#draftKindSeg button.active[data-v="todo"]{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(255,165,0,.35)}
#draftKindSeg button.active[data-v="record"]{background:var(--meeting);color:#fff;box-shadow:0 3px 8px rgba(52,120,217,.35)}
#typeSeg button.active[data-v="work"]{background:var(--work);color:#fff;box-shadow:0 3px 8px rgba(52,120,217,.35)}
#typeSeg button.active[data-v="personal"]{background:var(--personal);color:#fff;box-shadow:0 3px 8px rgba(34,164,71,.35)}
#prioSeg button.active[data-v="high"]{background:var(--high);color:#fff;box-shadow:0 3px 8px rgba(255,71,87,.3)}
#prioSeg button.active[data-v="medium"]{background:var(--accent-deep);color:#fff;box-shadow:0 3px 8px rgba(240,140,0,.3)}
#prioSeg button.active[data-v="low"]{background:var(--low);color:#fff}
#recTypeSeg button.active[data-v="meeting"]{background:var(--meeting);color:#fff;box-shadow:0 3px 8px rgba(52,120,217,.35)}
#recTypeSeg button.active[data-v="dacument"]{background:var(--dacument);color:#fff;box-shadow:0 3px 8px rgba(217,81,52,.3)}
#recTypeSeg button.active[data-v="document"]{background:var(--document);color:#fff;box-shadow:0 3px 8px rgba(40,167,69,.3)}
#recTypeSeg button.active[data-v="other"]{background:var(--other);color:#fff}
.pop-row{display: grid;grid-template-columns: 65% 35%;gap:10px}
.pop-row .pop-field{flex:1}
.pop-field input[type="time"],.pop-field input[type="date"]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:10px;color:var(--ink);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.pop-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,165,0,.12)}
.pop-field textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14px;line-height:1.6;resize:vertical;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.pop-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,165,0,.12)}
.phrase-group{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.phrase{font-size:12.5px;color:#51627a;background:#f0f3f8;border:1px solid var(--line);border-radius:99px;padding:5px 11px;transition:all .15s}
.phrase:hover{background:var(--accent-soft);border-color:#ffd591;color:var(--accent-deep)}
.pop-bottom{display:flex;justify-content:flex-end;gap:8px}
.btn-cancel{background:#eef1f5;color:var(--ink-2);border-radius:9px;padding:10px 24px;font-size:14px;font-weight:600;transition:all .15s}
.btn-cancel:hover{background:#e2e8f0}
.btn-submit{background:var(--accent);color:#fff;border-radius:9px;padding:10px 24px;font-size:14px;font-weight:700;box-shadow:0 4px 12px rgba(255,165,0,.35);transition:all .15s}
.btn-submit:hover{transform:translateY(-1px)}
/* ===== 提示 ===== */
.toast-wrap{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(44,62,80,.94);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;opacity:0;transform:translateY(8px);transition:all .28s}
.toast.show{opacity:1;transform:none}
.toast.warn{background:rgba(255,71,87,.94)}
/* ===== 响应式 ===== */
@media(max-width:640px){
 body{padding:104px 10px 156px}
 .topbar{padding:8px 10px}
 .topbar .btn{min-height:34px;padding:6px 8px;font-size:12.5px}
 .pills button{min-height:30px}
 .icon-btn{width:32px;height:32px}
 .cal-cell{min-height:40px;padding:4px 5px}
 .cal-dnum{font-size:13px}
 .cal-counts{margin-top:2px;gap:5px}
 .cal-cnt{font-size:11px}
 .cal-grid{gap:3px}
 .empty-all{padding:10px 12px;margin-bottom:8px}
 .empty-icon{display:none}
 .empty-title{font-size:14px;margin-bottom:2px}
 .module{margin-bottom:8px}

<script>
// ====================== 全局配置 ======================
const TODO_TYPE_KEY = {work:'公事', personal:'私事'};
const PRIO_KEY = {high:'高', medium:'中', low:'低'};
const PRIO_ORDER = {high:0, medium:1, low:2};
const REC_TYPE_KEY = {meeting:'会议', dacument:'报件', document:'取件', other:'其他'};
const TODO_PHRASES = {
  work:['参会交流，研究相关工作事项。','对接业务，协调推进相关工作落实。','整理材料，完善台账资料。','走访沟通，了解相关情况。','起草文稿，按时报送材料。'],
  personal:['买菜做饭，打理日常饮食。','锻炼身体，保持健康作息。','整理家务，打扫房间卫生。','阅读学习，提升自我能力。','联系家人，问候近况。']
};
const REC_PHRASES = {
  meeting:['参会交流，研究相关工作事项。','对接业务，协调推进相关工作落实。','会议记录，汇总会议纪要。'],
  dacument:['整理报件材料，完善台账资料。','报送材料，跟进审批进度。','收集核对，补齐报件要件。'],
  document:['领取文件，签收登记。','取件送达，转交相关科室。','核对清单，确认取件内容。'],
  other:['走访沟通，了解相关情况。','电话联系，协调工作事宜。','处理杂务，推进日常工作。']
};
const ACTION_META = {
  todo_add:{label:'新增待办', group:'todo'},
  todo_edit:{label:'编辑待办', group:'todo'},
  todo_toggle_on:{label:'完成待办', group:'todo'},
  todo_toggle_off:{label:'取消完成', group:'todo'},
  todo_star:{label:'标记星标', group:'todo'},
  todo_unstar:{label:'取消星标', group:'todo'},
  todo_pin:{label:'置顶待办', group:'todo'},
  todo_unpin:{label:'取消置顶', group:'todo'},
  todo_copy:{label:'复制待办', group:'todo'},
  todo_delete:{label:'待办移入回收站', group:'todo'},
  todo_restore:{label:'恢复待办', group:'recycle'},
  todo_purge:{label:'彻底删除待办', group:'recycle'},
  todo_clear:{label:'清空待办分区', group:'system'},
  rec_add:{label:'新增记录', group:'record'},
  rec_edit:{label:'编辑记录', group:'record'},
  rec_star:{label:'标记星标', group:'record'},
  rec_unstar:{label:'取消星标', group:'record'},
  rec_pin:{label:'置顶记录', group:'record'},
  rec_unpin:{label:'取消置顶', group:'record'},
  rec_copy:{label:'复制记录', group:'record'},
  rec_delete:{label:'记录移入回收站', group:'record'},
  rec_restore:{label:'恢复记录', group:'recycle'},
  rec_purge:{label:'彻底删除记录', group:'recycle'},
  rec_clear:{label:'清空当日记录', group:'system'},
  draft_add:{label:'新增草稿', group:'draft'},
  draft_edit:{label:'编辑草稿', group:'draft'},
  draft_convert_todo:{label:'草稿转待办', group:'draft'},
  draft_convert_record:{label:'草稿转记录', group:'draft'},
  draft_delete:{label:'删除草稿', group:'draft'},
  bin_empty:{label:'清空回收站', group:'recycle'},
  day_delete:{label:'删除当日数据', group:'system'},
  all_delete:{label:'删除全部数据', group:'system'},
  migrate:{label:'迁移历史数据', group:'system'}
};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const nowTime = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const todayStr = () => getDateKey(new Date());
function getDateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function formatDateCN(d){ return d.getFullYear()+' 年 '+pad(d.getMonth()+1)+' 月 '+pad(d.getDate())+' 日'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); }
function fmtTime(iso){
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtBytes(b){
  if (b < 1024) return b+' B';
  if (b < 1024*1024) return (b/1024).toFixed(1)+' KB';
  return (b/1024/1024).toFixed(2)+' MB';
}
// 图标
const starSVG = f => '<svg viewBox="0 0 24 24" width="15" height="15" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 16.5l-5.38 2.95 1.03-6L3.3 9.2l6-.9z"/></svg>';
const pinSVG = () => '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1.1 6.6L17 13.5v1.5H7v-1.5l3.1-2.9L9 4z"/><path d="M12 15v5"/></svg>';
const copySVG = () => '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const editSVG = () => '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const delSVG = () => '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';
// ====================== 状态 ======================
let currentDate = new Date();
let todos = [], records = [], bin = [], entries = [], drafts = [];
let todoFilter = 'all', recFilterType = 'all', dmTab = 'calendar', logFilter = 'all';
let uiState = { todoCollapsed:false, recCollapsed:false, dmTab:'calendar' };
let popupMode = 'todo', editingId = null, editingKind = null, draftNew = false;
let popupCache = { todoType:'work', priority:'medium', recType:'meeting', time:nowTime(), due:'', content:'', draftKind:'todo' };
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
// ====================== 存储 ======================
const KEY_BIN = 'app-bin-v1', KEY_LOGS = 'app-logs-v1', KEY_DRAFTS = 'app-drafts-v1', KEY_UI = 'app-ui-v1';
function storageKey(){ return 'day-'+getDateKey(currentDate); }
function getDayData(dayKey){
  const raw = localStorage.getItem(dayKey);
  const d = raw ? JSON.parse(raw) : null;
  return d && Array.isArray(d.todos) && Array.isArray(d.records) ? d : { todos:[], records:[] };
}
function saveData(){
  localStorage.setItem(storageKey(), JSON.stringify({ todos, records, updatedAt:new Date().toISOString() }));
}
function normalizeTodo(e){
  e.id = e.id || uid(); e.time = e.time || '';
  e.type = e.type === 'personal' ? 'personal' : 'work';
  e.priority = e.priority || 'medium'; e.due = e.due || ''; e.done = !!e.done; e.content = e.content || '';
  e.pin = !!e.pin; e.star = !!e.star;
  return e;
}
function normalizeRecord(r){
  r.id = r.id || uid(); r.time = r.time || '';
  r.type = REC_TYPE_KEY[r.type] ? r.type : 'other'; r.content = r.content || '';
  r.pin = !!r.pin; r.star = !!r.star;
  return r;
}
function loadData(){
  const d = getDayData(storageKey());
  todos = d.todos.map(normalizeTodo);
  records = d.records.map(normalizeRecord);
}
function loadBin(){ try { bin = JSON.parse(localStorage.getItem(KEY_BIN)||'null') || []; } catch(e){ bin = []; } }
function saveBin(){ localStorage.setItem(KEY_BIN, JSON.stringify(bin)); }
function loadLogs(){ try { entries = JSON.parse(localStorage.getItem(KEY_LOGS)||'null') || []; } catch(e){ entries = []; } }
function saveLogs(){ localStorage.setItem(KEY_LOGS, JSON.stringify(entries)); }
function loadDrafts(){ try { drafts = JSON.parse(localStorage.getItem(KEY_DRAFTS)||'null') || []; } catch(e){ drafts = []; } }
function saveDrafts(){ localStorage.setItem(KEY_DRAFTS, JSON.stringify(drafts)); }
function loadUI(){
  try { uiState = Object.assign({ todoCollapsed:false, recCollapsed:false, dmTab:'calendar' }, JSON.parse(localStorage.getItem(KEY_UI)||'{}')); } catch(e){}
  dmTab = uiState.dmTab || 'calendar';
}
function saveUI(){ localStorage.setItem(KEY_UI, JSON.stringify(uiState)); }
function log(action, detail){
  entries.unshift({ id:uid(), time:new Date().toISOString(), action, day:getDateKey(currentDate), detail: detail||'' });
  if (entries.length > 500) entries.length = 500;
  saveLogs();
}
// 迁移旧系统数据（原记录系统键 = 纯日期，原待办系统键 = todo-日期）
function migrateLegacy(){
  if (localStorage.getItem('day-migrated-v1')) return 0;
  let migrated = 0;
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  keys.forEach(k => {
    if (!k) return;
    if (/^\d{4}-\d{2}-\d{2}$/.test(k)){
      try {
        const d = JSON.parse(localStorage.getItem(k));
        const list = d.entries || [];
        if (list.length){
          const dayKey = 'day-'+k;
          const cur = getDayData(dayKey);
          list.forEach(e => { cur.records.push({ id:uid(), time:e.time||'', type:REC_TYPE_KEY[e.type]?e.type:'other', content:e.content||'' }); });
          localStorage.setItem(dayKey, JSON.stringify(cur));
          migrated += list.length;
        }
      } catch(err){}
    } else if (k.indexOf('todo-') === 0){
      try {
        const d = JSON.parse(localStorage.getItem(k));
        const list = d.entries || [];
        if (list.length){
          const dayKey = 'day-'+k.slice(5);
          const cur = getDayData(dayKey);
          list.forEach(e => { cur.todos.push(normalizeTodo({ id:uid(), time:e.time||'', type:e.type==='personal'?'personal':'work', priority:e.priority||'medium', due:e.due||'', done:!!e.done, content:e.content||'' })); });
          localStorage.setItem(dayKey, JSON.stringify(cur));
          migrated += list.length;
        }
      } catch(err){}
    }
  });
  localStorage.setItem('day-migrated-v1', '1');
  return migrated;
}
// ====================== 过滤与排序 ======================
function isOverdue(e){ return !e.done && e.due && e.due < todayStr(); }
function dueBadge(e){
  if (!e.due) return '';
  const ov = isOverdue(e);
  return '<span class="badge due'+(ov?' overdue':'')+'">'+(ov?'已逾期 ':'截止 ')+esc(e.due.slice(5))+'</span>';
}
function visibleTodos(type){
  return todos.filter(e => {
    if (e.type !== type) return false;
    if (todoFilter === 'pending' && e.done) return false;
    if (todoFilter === 'done' && !e.done) return false;
    if (todoFilter === 'overdue' && !isOverdue(e)) return false;
    return true;
  });
}
function sortedTodos(list){
  return list.slice().sort((a,b) => {
    if (!!a.pin !== !!b.pin) return a.pin ? -1 : 1;
    if (!!a.star !== !!b.star) return a.star ? -1 : 1;
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.done && a.priority !== b.priority) return PRIO_ORDER[a.priority] - PRIO_ORDER[b.priority];
    return (b.time || '').localeCompare(a.time || '');
  });
}
function visibleRecords(){
  return records.filter(r => recFilterType === 'all' || r.type === recFilterType);
}
function sortedRecords(list){
  return list.slice().sort((a,b) => {
    if (!!a.pin !== !!b.pin) return a.pin ? -1 : 1;
    if (!!a.star !== !!b.star) return a.star ? -1 : 1;
    return (b.time || '').localeCompare(a.time || '');
  });
}

function renderStats(){
  const total = todos.length;
  const done = todos.filter(e => e.done).length;
  const pending = total - done;
  const overdue = todos.filter(isOverdue).length;
  $('statTotal').textContent = total;
  $('statPending').textContent = pending;
  $('statDone').textContent = done;
  $('statRecords').textContent = records.length;
  const pct = total ? Math.round(done/total*100) : 0;
  $('progressBar').style.width = pct + '%';
  $('progressText').textContent = pct + '%';
  $('overduePill').style.display = overdue ? 'inline-block' : 'none';
  if (overdue) $('overduePill').textContent = '逾期 '+overdue+' 条';
  $('workCount').textContent = todos.filter(e => e.type === 'work').length;
  $('personalCount').textContent = todos.filter(e => e.type === 'personal').length;
  $('recCount').textContent = records.length;
}
function renderAll(){
  const hasTodo = todos.length > 0;
  const hasRec = records.length > 0;
  const clean = !hasTodo && !hasRec;
  $('emptyAll').style.display = clean ? 'block' : 'none';
  $('todoModule').style.display = hasTodo ? '' : 'none';
  $('recModule').style.display = hasRec ? '' : 'none';
  $('todoModule').classList.toggle('collapsed', uiState.todoCollapsed);
  $('recModule').classList.toggle('collapsed', uiState.recCollapsed);
  if (hasTodo){
    renderTodoList($('workList'), sortedTodos(visibleTodos('work')), 'work');
    renderTodoList($('personalList'), sortedTodos(visibleTodos('personal')), 'personal');
  }
  if (hasRec) renderRecList();
  renderStats();
  renderDM();
}
// ====================== 数据管理 ======================
function updateStorageBar(){
  let bytes = 0, days = 0, todoN = 0, recN = 0;
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (!k) continue;
    const v = localStorage.getItem(k) || '';
    bytes += (k.length + v.length) * 2;
    if (k.indexOf('day-') === 0){
      days++;
      try { const d = JSON.parse(v); if (d && Array.isArray(d.todos)){ todoN += d.todos.length; recN += d.records.length; } } catch(e){}
    }
  }
  const cap = 5*1024*1024;
  const pct = Math.min(100, bytes/cap*100);
  $('storageText').textContent = fmtBytes(bytes)+' / 约 5 MB';
  const bar = $('storageBar');
  bar.style.width = pct.toFixed(1) + '%';
  bar.classList.toggle('ok', pct < 60);
  bar.classList.toggle('warn', pct >= 60 && pct < 90);
  bar.classList.toggle('danger', pct >= 90);
  $('storageInfo').textContent = '已存 '+days+' 天 · 待办 '+todoN+' 条 · 记录 '+recN+' 条 · 回收站 '+bin.length+' 条 · 草稿 '+drafts.length+' 条 · 日志 '+entries.length+' 条';
}
function dayCounts(key){
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    const t = (d.todos || []).length, r = (d.records || []).length;
    return (t + r > 0) ? { t, r } : null;
  } catch(e){ return null; }
}
function renderCalendar(){
  $('calTitle').textContent = calYear+' 年 '+(calMonth+1)+' 月';
  const wd = ['日','一','二','三','四','五','六'];
  $('calWeek').innerHTML = wd.map(w => '<div class="cal-cell week">'+w+'</div>').join('');
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const dim = new Date(calYear, calMonth+1, 0).getDate();
  const tKey = todayStr();
  const selKey = getDateKey(currentDate);
  let html = '';
  for (let i = 0; i < startDow; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= dim; d++){
    const key = calYear+'-'+pad(calMonth+1)+'-'+pad(d);
    const c = dayCounts('day-'+key);
    const cls = ['cal-cell','day'];
    if (key === tKey) cls.push('today');
    if (key === selKey) cls.push('selected');
    html += '<div class="'+cls.join(' ')+'" data-day="'+key+'">'
      + '<span class="cal-dnum">'+d+'</span>'
      + (c ? '<div class="cal-counts">'
        + (c.t ? '<span class="cal-cnt todo">待'+c.t+'</span>' : '')
        + (c.r ? '<span class="cal-cnt rec">记'+c.r+'</span>' : '')
        + '</div>' : '')
      + '</div>';
  }
  $('calGrid').innerHTML = html;
}

// ====================== 弹窗 ======================
function setSeg(id, v){
  document.querySelectorAll('#'+id+' button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
}
function applyModeUI(){
  const isDraft = popupMode === 'draft';
  const kind = popupCache.draftKind;
  const isTodo = popupMode === 'todo' || (isDraft && kind === 'todo');
  const isRec = popupMode === 'record' || (isDraft && kind === 'record');
  $('draftKindField').style.display = draftNew ? '' : 'none';
  $('todoTypePrioField').style.display = isTodo ? '' : 'none';
  $('recTypeField').style.display = isRec ? '' : 'none';
  $('popDueField').style.display = isTodo ? '' : 'none';
  $('contentLabel').textContent = isDraft ? '草稿内容' : (isTodo ? '待办内容' : '记录内容');
  renderPhrases();
}
function renderPhrases(){
  const kind = popupMode === 'draft' ? popupCache.draftKind : popupMode;
  const list = kind === 'todo' ? TODO_PHRASES[popupCache.todoType] : REC_PHRASES[popupCache.recType];
  $('phraseGroup').innerHTML = list.map(p => '<button type="button" class="phrase" data-phrase="'+esc(p)+'">'+esc(p)+'</button>').join('');
  if (kind === 'todo'){
    $('popContent').placeholder = popupCache.todoType === 'work' ? '请输入公事待办内容，例如：整理迎检材料…' : '请输入私事待办内容，例如：取快递、锻炼身体…';
  } else {
    $('popContent').placeholder = '请输入'+REC_TYPE_KEY[popupCache.recType]+'记录内容…';
  }
}
function openPopup(mode, kind, id){
  popupMode = mode;
  editingId = id || null;
  editingKind = kind || mode;
  draftNew = (mode === 'draft' && !id);
  if (editingId){
    if (editingKind === 'draft'){
      const d = drafts.find(x => x.id === id);
      if (d) popupCache = { todoType:d.type || 'work', priority:d.priority || 'medium', recType:d.recType || 'meeting', time:d.time, due:d.due || '', content:d.content, draftKind:d.mode || 'todo' };
    } else if (editingKind === 'todo'){
      const e = todos.find(x => x.id === id);
      if (e) popupCache = { todoType:e.type, priority:e.priority, recType:'meeting', time:e.time, due:e.due || '', content:e.content, draftKind:'todo' };
    } else {
      const r = records.find(x => x.id === id);
      if (r) popupCache = { todoType:'work', priority:'medium', recType:r.type, time:r.time, due:'', content:r.content, draftKind:'record' };
    }
  } else {
    popupCache = { todoType:'work', priority:'medium', recType:'meeting', time:nowTime(), due:'', content:'', draftKind:'todo' };
  }
  let title;
  if (editingKind === 'draft') title = '编辑草稿';
  else if (draftNew) title = '新增草稿';
  else if (popupMode === 'todo') title = editingId ? '编辑待办' : '新增待办';
  else title = editingId ? '编辑记录' : '新增记录';
  $('popTitle').textContent = title;
  $('btnSubmit').textContent = (draftNew || editingKind === 'draft') ? '保存草稿' : '确认提交';
  $('btnDraftSave').style.display = (!draftNew && !editingId && (popupMode === 'todo' || popupMode === 'record')) ? '' : 'none';
  applyModeUI();
  setSeg('draftKindSeg', popupCache.draftKind);
  setSeg('typeSeg', popupCache.todoType);
  setSeg('prioSeg', popupCache.priority);
  setSeg('recTypeSeg', popupCache.recType);
  $('popTime').value = popupCache.time || nowTime();
  $('popDue').value = popupCache.due || '';
  $('popContent').value = popupCache.content;
  const mask = $('popupMask');
  mask.style.display = 'flex';
  requestAnimationFrame(() => { mask.classList.add('show'); $('popContent').focus(); });
}
function closePopup(){
  const mask = $('popupMask');
  mask.classList.remove('show');
  setTimeout(() => { mask.style.display = 'none'; }, 260);
}
function submitPopup(){
  const content = $('popContent').value.trim();
  if (!content){ toast('内容不能为空', 'warn'); $('popContent').focus(); return; }
  const time = $('popTime').value || nowTime();
  if (editingKind === 'draft'){
    const d = drafts.find(x => x.id === editingId);
    if (d){ d.type = popupCache.todoType; d.priority = popupCache.priority; d.recType = popupCache.recType; d.time = time; d.due = $('popDue').value; d.content = content; d.updatedAt = new Date().toISOString(); }
    saveDrafts(); log('draft_edit', content.slice(0, 30)); toast('草稿已更新');
  } else if (draftNew){
    drafts.push({ id:uid(), mode:popupCache.draftKind, type:popupCache.todoType, priority:popupCache.priority, recType:popupCache.recType, time, due:$('popDue').value, content, updatedAt:new Date().toISOString() });
    saveDrafts(); log('draft_add', content.slice(0, 30)); toast('草稿已保存');
  } else if (popupMode === 'todo'){
    const type = $('typeSeg').querySelector('.active').dataset.v;
    const priority = $('prioSeg').querySelector('.active').dataset.v;
    const due = $('popDue').value;
    if (editingId){
      const e = todos.find(x => x.id === editingId);
      if (e){ e.time = time; e.type = type; e.priority = priority; e.content = content; e.due = due; }
      toast('待办已更新'); log('todo_edit', content.slice(0, 30));
    } else {
      todos.push(normalizeTodo({ id:uid(), time, type, priority, content, due, done:false }));
      toast('已添加待办'); log('todo_add', content.slice(0, 30));
    }
    saveData();
  } else {
    const rtype = $('recTypeSeg').querySelector('.active').dataset.v;
    if (editingId){
      const r = records.find(x => x.id === editingId);
      if (r){ r.time = time; r.type = rtype; r.content = content; }
      toast('记录已更新'); log('rec_edit', content.slice(0, 30));
    } else {
      records.push(normalizeRecord({ id:uid(), time, type:rtype, content }));
      toast('已添加记录'); log('rec_add', content.slice(0, 30));
    }
    saveData();
  }
  renderAll();
  popupCache = { todoType:'work', priority:'medium', recType:'meeting', time:nowTime(), due:'', content:'', draftKind:'todo' };
  closePopup();
}
function saveDraftFromPopup(){
  const content = $('popContent').value.trim();
  if (!content){ toast('内容不能为空', 'warn'); $('popContent').focus(); return; }
  const time = $('popTime').value || nowTime();
  const mode = popupMode === 'record' ? 'record' : 'todo';
  drafts.push({ id:uid(), mode, type:popupCache.todoType, priority:popupCache.priority, recType:popupCache.recType, time, due:$('popDue').value, content, updatedAt:new Date().toISOString() });
  saveDrafts(); log('draft_add', content.slice(0, 30)); toast('已存为草稿');
  popupCache = { todoType:'work', priority:'medium', recType:'meeting', time:nowTime(), due:'', content:'', draftKind:'todo' };
  closePopup();
  renderAll();
}
// ====================== 待办 / 记录操作 ======================
function toggleTodo(id){
  const e = todos.find(x => x.id === id);
  if (!e) return;
  e.done = !e.done;
  saveData();
  log(e.done ? 'todo_toggle_on' : 'todo_toggle_off', e.content.slice(0, 30));
  renderAll();
}
function toggleStar(kind, id){
  if (kind === 'todo'){
    const e = todos.find(x => x.id === id);
    if (!e) return;
    e.star = !e.star; saveData();
    log(e.star ? 'todo_star' : 'todo_unstar', e.content.slice(0, 30));
  } else {
    const r = records.find(x => x.id === id);
    if (!r) return;
    r.star = !r.star; saveData();
    log(r.star ? 'rec_star' : 'rec_unstar', r.content.slice(0, 30));
  }
  renderAll();
}
function togglePin(kind, id){
  if (kind === 'todo'){
    const e = todos.find(x => x.id === id);
    if (!e) return;
    e.pin = !e.pin; saveData();
    log(e.pin ? 'todo_pin' : 'todo_unpin', e.content.slice(0, 30));
  } else {
    const r = records.find(x => x.id === id);
    if (!r) return;
    r.pin = !r.pin; saveData();
    log(r.pin ? 'rec_pin' : 'rec_unpin', r.content.slice(0, 30));
  }
  renderAll();
}
function copyTodoOne(e){
  const prio = (e.priority && e.priority !== 'medium') ? '【'+PRIO_KEY[e.priority]+'】' : '';
  const pin = e.pin ? '【置顶】' : '';
  const star = e.star ? '【星标】' : '';
  return '- ['+(e.done?'x':' ')+'] '+e.time+' '+pin+star+prio+' '+e.content.replace(/\n/g, ' ');
}
function copyRecOne(r){
  const pin = r.pin ? '【置顶】' : '';
  const star = r.star ? '【星标】' : '';
  return '- '+r.time+'｜'+(REC_TYPE_KEY[r.type]||'其他')+'｜'+pin+star+' '+r.content.replace(/\n/g, ' ');
}
function copyItem(kind, id){
  if (kind === 'todo'){
    const e = todos.find(x => x.id === id);
    if (!e) return;
    copyText(copyTodoOne(e), '待办内容已复制');
    log('todo_copy', e.content.slice(0, 30));
  } else {
    const r = records.find(x => x.id === id);
    if (!r) return;
    copyText(copyRecOne(r), '记录内容已复制');
    log('rec_copy', r.content.slice(0, 30));
  }
}
function deleteTodo(id){
  const e = todos.find(x => x.id === id);
  if (!e) return;
  if (!confirm('确定删除这条待办吗？将移入回收站，可随时恢复。')) return;
  bin.unshift({ id:uid(), kind:'todo', day:getDateKey(currentDate), item:JSON.parse(JSON.stringify(e)), deletedAt:new Date().toISOString() });
  saveBin();
  todos = todos.filter(x => x.id !== id);
  saveData();
  log('todo_delete', e.content.slice(0, 30));
  renderAll();
  toast('待办已移入回收站');
}
function deleteRecord(id){
  const r = records.find(x => x.id === id);
  if (!r) return;
  if (!confirm('确定删除这条记录吗？将移入回收站，可随时恢复。')) return;
  bin.unshift({ id:uid(), kind:'record', day:getDateKey(currentDate), item:JSON.parse(JSON.stringify(r)), deletedAt:new Date().toISOString() });
  saveBin();
  records = records.filter(x => x.id !== id);
  saveData();
  log('rec_delete', r.content.slice(0, 30));
  renderAll();
  toast('记录已移入回收站');
}
function clearTodoSection(type){
  const list = todos.filter(e => e.type === type);
  if (!list.length){ toast(TODO_TYPE_KEY[type]+'暂无内容'); return; }
  if (!confirm('确定将全部'+TODO_TYPE_KEY[type]+'待办移入回收站吗？')) return;
  const day = getDateKey(currentDate);
  list.forEach(e => bin.unshift({ id:uid(), kind:'todo', day, item:JSON.parse(JSON.stringify(e)), deletedAt:new Date().toISOString() }));
  saveBin();
  todos = todos.filter(e => e.type !== type);
  saveData();
  log('todo_clear', TODO_TYPE_KEY[type]);
  renderAll();
  toast(TODO_TYPE_KEY[type]+'已移入回收站');
}
function clearRecords(){
  if (!records.length){ toast('今日暂无记录'); return; }
  if (!confirm('确定将今日全部记录移入回收站吗？')) return;
  const day = getDateKey(currentDate);
  records.forEach(r => bin.unshift({ id:uid(), kind:'record', day, item:JSON.parse(JSON.stringify(r)), deletedAt:new Date().toISOString() }));
  saveBin();
  records = [];
  saveData();
  log('rec_clear', '清空当日记录');
  renderAll();
  toast('记录已移入回收站');
}
// ====================== 回收站 ======================
function restoreBinItem(id){
  const b = bin.find(x => x.id === id);
  if (!b) return;
  const dayKey = 'day-' + b.day;
  const cur = getDayData(dayKey);
  if (b.kind === 'todo') cur.todos.push(normalizeTodo(b.item));
  else cur.records.push(normalizeRecord(b.item));
  localStorage.setItem(dayKey, JSON.stringify({ todos:cur.todos, records:cur.records, updatedAt:new Date().toISOString() }));
  bin = bin.filter(x => x.id !== id);
  saveBin();
  loadData();
  log(b.kind === 'todo' ? 'todo_restore' : 'rec_restore', (b.item && b.item.content || '').slice(0, 30));
  renderAll();
  toast('已恢复到 '+b.day);
}
function purgeBinItem(id){
  const b = bin.find(x => x.id === id);
  if (!b) return;
  if (!confirm('彻底删除后不可恢复，确定吗？')) return;
  bin = bin.filter(x => x.id !== id);
  saveBin();
  log(b.kind === 'todo' ? 'todo_purge' : 'rec_purge', (b.item && b.item.content || '').slice(0, 30));
  renderAll();
  toast('已彻底删除');
}
function emptyBin(){
  if (!bin.length){ toast('回收站为空'); return; }
  if (!confirm('将永久删除回收站全部 '+bin.length+' 条数据，不可恢复！')) return;
  bin = [];
  saveBin();
  log('bin_empty', '清空回收站');
  renderAll();
  toast('回收站已清空');
}
// ====================== 草稿 ======================
function convertDraft(id){
  const d = drafts.find(x => x.id === id);
  if (!d) return;
  const cur = getDayData(storageKey());
  if (d.mode === 'todo') cur.todos.push(normalizeTodo({ id:uid(), time:d.time, type:d.type, priority:d.priority, due:d.due, done:false, content:d.content }));
  else cur.records.push(normalizeRecord({ id:uid(), time:d.time, type:d.recType, content:d.content }));
  localStorage.setItem(storageKey(), JSON.stringify({ todos:cur.todos, records:cur.records, updatedAt:new Date().toISOString() }));
  drafts = drafts.filter(x => x.id !== id);
  saveDrafts();
  loadData();
  log(d.mode === 'todo' ? 'draft_convert_todo' : 'draft_convert_record', d.content.slice(0, 30));
  renderAll();
  toast('草稿已转为'+(d.mode === 'todo' ? '待办' : '记录'));
}
function deleteDraft(id){
  const d = drafts.find(x => x.id === id);
  if (!d) return;
  if (!confirm('确定删除该草稿吗？')) return;
  drafts = drafts.filter(x => x.id !== id);
  saveDrafts();
  log('draft_delete', d.content.slice(0, 30));
  renderAll();
  toast('草稿已删除');
}
// ====================== 复制 / 导出 ======================
function mdItem(e){
  const prio = (e.priority && e.priority !== 'medium') ? '【'+PRIO_KEY[e.priority]+'】' : '';
  const pin = e.pin ? '【置顶】' : '';
  const star = e.star ? '【星标】' : '';
  return '- ['+(e.done?'x':' ')+'] '+e.time+' '+pin+star+prio+' '+e.content.replace(/\n/g, ' ')+'\n';
}
function mdTodoSection(type){
  const list = sortedTodos(todos.filter(e => e.type === type));
  if (!list.length) return '';
  let md = '### '+TODO_TYPE_KEY[type]+'（'+list.length+'）\n';
  list.forEach(e => { md += mdItem(e); });
  return md;
}
function mdRecords(){
  const list = sortedRecords(records);
  if (!list.length) return '';
  let md = '## 每日记录（'+records.length+'）\n';
  list.forEach(r => { md += '- '+r.time+'｜'+(REC_TYPE_KEY[r.type]||'其他')+'｜'+r.content.replace(/\n/g, ' ')+'\n'; });
  return md;
}
function mdDay(){
  let md = '# 待办与每日记录 '+formatDateCN(currentDate)+'\n\n';
  const todoWork = mdTodoSection('work');
  const todoPersonal = mdTodoSection('personal');
  if (todoWork || todoPersonal){
    md += '## 待办事项\n';
    if (todoWork) md += todoWork;
    if (todoPersonal) md += todoPersonal;
    md += '\n';
  }
  const recs = mdRecords();
  if (recs) md += recs;
  if (!todos.length && !records.length) md += '（今日暂无内容）\n';
  return md;
}
async function copyText(text, okMsg){
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg);
  } catch(err){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast(okMsg); }
    catch(e2){ toast('复制失败，请手动复制', 'warn'); }
    document.body.removeChild(ta);
  }
}
function copyTodoSection(type){
  const md = mdTodoSection(type);
  if (!md){ toast(TODO_TYPE_KEY[type]+'暂无内容'); return; }
  copyText(md, TODO_TYPE_KEY[type]+'内容已复制');
}
function copyRecords(){
  const md = mdRecords();
  if (!md){ toast('今日暂无记录'); return; }
  copyText(md, '记录内容已复制');
}
function exportMD(){
  const blob = new Blob([mdDay()], { type:'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = formatDateCN(currentDate)+'待办与记录_'+nowTime().replace(':','')+'.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 300);
  toast('已导出 Markdown 文件');
}
// ====================== 删除 ======================
function deleteDay(){
  if (!todos.length && !records.length){ toast('今日暂无数据'); return; }
  if (!confirm('确定删除今日全部待办与记录吗？将移入回收站，可随时恢复。')) return;
  const day = getDateKey(currentDate);
  todos.forEach(e => bin.unshift({ id:uid(), kind:'todo', day, item:JSON.parse(JSON.stringify(e)), deletedAt:new Date().toISOString() }));
  records.forEach(r => bin.unshift({ id:uid(), kind:'record', day, item:JSON.parse(JSON.stringify(r)), deletedAt:new Date().toISOString() }));
  saveBin();
  localStorage.removeItem(storageKey());
  todos = [];
  records = [];
  log('day_delete', '删除 '+day+' 全部数据');
  renderAll();
  toast('已删除当日数据');
}
function deleteAll(){
  const keys = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.indexOf('day-') === 0) keys.push(k);
  }
  if (!keys.length){ toast('暂无任何数据'); return; }
  if (!confirm('即将删除所有日期的全部待办与记录，并移入回收站！\n回收站需手动彻底删除，确认继续吗？')) return;
  keys.forEach(k => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(k)); } catch(e){}
    if (d){
      const day = k.slice(4);
      (d.todos || []).forEach(e => bin.unshift({ id:uid(), kind:'todo', day, item:JSON.parse(JSON.stringify(e)), deletedAt:new Date().toISOString() }));
      (d.records || []).forEach(r => bin.unshift({ id:uid(), kind:'record', day, item:JSON.parse(JSON.stringify(r)), deletedAt:new Date().toISOString() }));
    }
    localStorage.removeItem(k);
  });
  saveBin();
  todos = [];
  records = [];
  log('all_delete', '删除全部数据');
  renderAll();
  toast('已清空全部数据');
}
// ====================== 日期 ======================
function updateDatePicker(){
  $('datePicker').value = getDateKey(currentDate);
  $('todayPill').style.display = todayStr() === getDateKey(currentDate) ? 'inline-flex' : 'none';
}
function changeDate(offset){
  currentDate.setDate(currentDate.getDate() + offset);
  calYear = currentDate.getFullYear();
  calMonth = currentDate.getMonth();
  updateDatePicker();
  loadData();
  renderAll();
}
// ====================== 提示 ======================
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'warn' ? ' warn' : '');
  t.textContent = msg;
  $('toastWrap').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
}
// ====================== 事件绑定 ======================
function bindSeg(segId, onChange){
  $(segId).addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    $(segId).querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if (onChange) onChange(b.dataset.v);
  });
}
function toggleModule(which){
  if (which === 'todo') uiState.todoCollapsed = !uiState.todoCollapsed;
  else uiState.recCollapsed = !uiState.recCollapsed;
  saveUI();
  $('todoModule').classList.toggle('collapsed', uiState.todoCollapsed);
  $('recModule').classList.toggle('collapsed', uiState.recCollapsed);
}
function bindHeadToggle(headId, which){
  $(headId).addEventListener('click', e => {
    // 排除筛选按钮，允许点击chevron箭头svg
    if (e.target.closest('.head-filters button')) return; 
    toggleModule(which);
  });
}
function init(){
  updateDatePicker();
  const migrated = migrateLegacy();
  loadData();
  loadBin();
  loadLogs();
  loadDrafts();
  loadUI();
  calYear = currentDate.getFullYear();
  calMonth = currentDate.getMonth();
  $('todoModule').classList.toggle('collapsed', uiState.todoCollapsed);
  $('recModule').classList.toggle('collapsed', uiState.recCollapsed);
  document.querySelectorAll('#dmTabs button').forEach(x => x.classList.toggle('active', x.dataset.tab === dmTab));
  renderAll();
  if (migrated){
    log('migrate', '迁移历史数据 '+migrated+' 条');
    toast('已自动迁移 '+migrated+' 条历史数据');
  }
  $('btnPrev').addEventListener('click', () => changeDate(-1));
  $('btnNext').addEventListener('click', () => changeDate(1));
  $('datePicker').addEventListener('change', e => {
    if (!e.target.value) return;
    const d = new Date(e.target.value + 'T00:00:00');
    currentDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    calYear = currentDate.getFullYear();
    calMonth = currentDate.getMonth();
    updateDatePicker();
    loadData();
    renderAll();
  });
  $('btnAddTodo').addEventListener('click', () => openPopup('todo'));
  $('btnAddRecord').addEventListener('click', () => openPopup('record'));
  $('popClose').addEventListener('click', closePopup);
  $('btnCancel').addEventListener('click', closePopup);
  $('btnSubmit').addEventListener('click', submitPopup);
  $('btnDraftSave').addEventListener('click', saveDraftFromPopup);
  $('popupMask').addEventListener('click', e => { if (e.target === $('popupMask')) closePopup(); });
  $('popContent').addEventListener('input', () => { popupCache.content = $('popContent').value; });
  bindSeg('typeSeg', v => { popupCache.todoType = v; renderPhrases(); });
  bindSeg('prioSeg', v => { popupCache.priority = v; });
  bindSeg('recTypeSeg', v => { popupCache.recType = v; renderPhrases(); });
  bindSeg('draftKindSeg', v => { popupCache.draftKind = v; applyModeUI(); });
  document.querySelectorAll('.item-list').forEach(list => {
    list.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const it = btn.closest('.item');
      if (!it) return;
      const id = it.dataset.id, act = btn.dataset.action;
      if (act === 'toggle') toggleTodo(id);
      else if (act === 'star') toggleStar('todo', id);
      else if (act === 'pin') togglePin('todo', id);
      else if (act === 'copy') copyItem('todo', id);
      else if (act === 'edit') openPopup('todo', 'todo', id);
      else if (act === 'del') deleteTodo(id);
    });
  });
  $('recList').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const it = btn.closest('.rec-item');
    if (!it) return;
    const id = it.dataset.id, act = btn.dataset.action;
    if (act === 'star') toggleStar('record', id);
    else if (act === 'pin') togglePin('record', id);
    else if (act === 'copy') copyItem('record', id);
    else if (act === 'edit-rec') openPopup('record', 'record', id);
    else if (act === 'del-rec') deleteRecord(id);
  });
  document.querySelectorAll('.section-actions').forEach(sec => {
    sec.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.action === 'copy-section') copyTodoSection(btn.dataset.type);
      else if (btn.dataset.action === 'clear-section') clearTodoSection(btn.dataset.type);
      else if (btn.dataset.action === 'copy-records') copyRecords();
      else if (btn.dataset.action === 'clear-records') clearRecords();
    });
  });
  $('todoFilter').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#todoFilter button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    todoFilter = b.dataset.f;
    renderAll();
  });
  $('recFilter').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#recFilter button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    recFilterType = b.dataset.f;
    renderAll();
  });
  $('btnCopyDay').addEventListener('click', () => {
    (todos.length || records.length) ? copyText(mdDay(), '当日内容已复制') : toast('今日暂无内容');
  });
  $('btnExportMD').addEventListener('click', exportMD);
  $('btnDataMgmt').addEventListener('click', () => $('dmModule').scrollIntoView({ behavior:'smooth', block:'start' }));
  $('btnDeleteDay').addEventListener('click', deleteDay);
  $('btnDeleteAll').addEventListener('click', deleteAll);
  // 数据管理
  $('dmTabs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#dmTabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    dmTab = b.dataset.tab;
    uiState.dmTab = dmTab;
    saveUI();
    renderDM();
  });
  $('calPrev').addEventListener('click', () => { calMonth--; if (calMonth < 0){ calMonth = 11; calYear--; } renderCalendar(); });
  $('calNext').addEventListener('click', () => { calMonth++; if (calMonth > 11){ calMonth = 0; calYear++; } renderCalendar(); });
  $('calToday').addEventListener('click', () => { calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); renderCalendar(); });
  $('calGrid').addEventListener('click', e => {
    const cell = e.target.closest('.cal-cell.day');
    if (!cell || !cell.dataset.day) return;
    const d = new Date(cell.dataset.day + 'T00:00:00');
    currentDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    calYear = currentDate.getFullYear();
    calMonth = currentDate.getMonth();
    updateDatePicker();
    loadData();
    renderAll();
  });
  $('binList').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const it = e.target.closest('.dm-item');
    if (!it || !it.dataset.id) return;
    if (btn.dataset.action === 'restore') restoreBinItem(it.dataset.id);
    else if (btn.dataset.action === 'purge') purgeBinItem(it.dataset.id);
  });
  $('btnEmptyBin').addEventListener('click', emptyBin);
  $('draftList').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const it = e.target.closest('.dm-item');
    if (!it || !it.dataset.id) return;
    const id = it.dataset.id;
    if (btn.dataset.action === 'edit') openPopup('draft', 'draft', id);
    else if (btn.dataset.action === 'convert') convertDraft(id);
    else if (btn.dataset.action === 'del') deleteDraft(id);
  });
  $('btnAddDraft').addEventListener('click', () => openPopup('draft'));
  $('logFilter').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#logFilter button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    logFilter = b.dataset.g;
    renderLogs();
  });
  $('btnClearLogs').addEventListener('click', () => {
    if (!entries.length){ toast('暂无日志'); return; }
    if (!confirm('确定清空全部操作日志吗？')) return;
    entries = [];
    saveLogs();
    renderLogs();
    toast('日志已清空');
  });
  bindHeadToggle('todoHead', 'todo');
  bindHeadToggle('recHead', 'rec');
  $('phraseGroup').addEventListener('click', e => {
    const b = e.target.closest('.phrase');
    if (!b) return;
    const ta = $('popContent');
    ta.value += (ta.value ? '\n' : '') + b.dataset.phrase;
    popupCache.content = ta.value;
    ta.focus();
  });
  document.addEventListener('keydown', e => {
    const mask = $('popupMask');
    if (!mask.classList.contains('show')) return;
    if (e.key === 'Escape') closePopup();
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); submitPopup(); }
  });
  window.addEventListener('beforeunload', () => { if (todos.length || records.length) saveData(); });
}
init();
</script>
