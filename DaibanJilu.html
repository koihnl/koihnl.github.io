.dm-warn{display:flex;align-items:center;gap:8px;background:var(--danger-soft);border:1px solid #f6c9c9;color:#8f2b2b;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5}
.dm-warn svg{flex:none}
.dm-warn span{flex:1;min-width:0}
.dm-sec-head{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.4px;margin-top:2px}
.dm-tabs{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0}
.dm-dayops{display:flex;gap:6px;flex-wrap:wrap}
.dm-prefs{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:10px 12px}

.pref-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #edf1f6}
.pref-row:last-of-type{border-bottom:none}
.pref-label{font-size:12.5px;color:var(--ink-2)}
.pref-switch{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pref-select{font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:52%}
.pref-note{font-size:11.5px;color:var(--ink-3);line-height:1.65;margin:8px 0 0}
.dm-snap-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.snap-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);padding:4px 7px;border-radius:8px;background:#fff;border:1px solid #eef2f7}
.snap-row b{font-weight:700;color:var(--ink)}
.snap-row .snap-act{margin-left:auto;display:flex;gap:4px}
.snap-empty{font-size:11.5px;color:var(--ink-3)}
.dm-assure{margin:0;background:#fff;border:1px solid var(--line);box-shadow:none}
.resume-chip{position:fixed;left:14px;bottom:22px;z-index:1200;display:none;align-items:center;gap:8px;max-width:min(72vw,330px);background:#fff;border:1px solid var(--accent);border-radius:999px;padding:8px 14px 8px 10px;box-shadow:0 8px 24px rgba(240,161,0,.26);font-size:12.5px;color:var(--ink);cursor:pointer}
.resume-chip.show{display:flex}
.resume-chip .rc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px rgba(240,161,0,.18)}
.resume-chip #resumeChipText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.act{display:flex;align-items:center;gap:10px;pointer-events:none;max-width:min(88vw,460px)}
.toast .toast-act{pointer-events:auto;flex:none;color:#ffd479;font-weight:700;text-decoration:underline;text-underline-offset:2px;font-size:13px}
.search-result.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(240,161,0,.45)}
@media(max-width:640px){
 .dm-mask{padding:0}
 .dm-box{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0}
 .dm-scroll{padding:10px 12px 18px}
 .dm-top{padding:12px 12px 10px}
 .dm-tabs{gap:4px}
 .resume-chip{bottom:96px;left:10px;max-width:calc(100vw - 20px)}
}
/* 搜索结果键盘选中高亮 */
.search-result.kbd-sel{outline:2px solid var(--accent);outline-offset:2px;background:#fff8e8;border-radius:8px}
.search-more{display:block;width:100%;margin:6px 0 2px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:#fff;color:var(--ink-3);font-size:12.5px;text-align:center;cursor:pointer}
.search-more:hover{color:var(--accent);border-color:var(--accent);background:#fffaf0}
.chip-more{flex:none;border:1px dashed var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-3);cursor:pointer;line-height:1.5}
.chip-more:hover{color:var(--accent-deep);border-color:var(--accent)}
/* ====================== 管理工作台 v12 ====================== */
.dm-box{max-width:880px;border-radius:24px;background:linear-gradient(180deg,#fff,#fdfefe)}
.dm-top{align-items:center;padding:15px 16px 11px;border-bottom:1px solid var(--line);gap:10px}
.dm-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.dm-brand-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#fff3d6,#ffe3ae);color:#8a5a00;flex:none;box-shadow:inset 0 0 0 1px #f6d99a}
.dm-title-wrap{min-width:0}
.dm-tabbar{padding:9px 12px 8px;background:#fff;border-bottom:1px solid var(--line)}
.dm-tabs{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding:1px 1px 3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dm-tabs::-webkit-scrollbar{display:none}
.dm-tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .16s,border-color .16s,color .16s;white-space:nowrap}
.dm-tabs button svg{width:13px;height:13px;opacity:.65;flex:none}
.dm-tabs button.active{background:linear-gradient(135deg,#fff2d5,#ffe4b0);border-color:#f0c469;color:#8a5a00;box-shadow:0 2px 8px rgba(240,161,0,.14)}
.dm-tabs button.active svg{opacity:1}
.dm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:2px 0 4px}
@media(min-width:600px){.dm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dm-hint{font-size:11.5px;color:var(--ink-3);line-height:1.65;padding:2px 2px 8px}
.dm-card{min-width:0;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .16s,box-shadow .16s,border-color .16s}
.dm-card:hover,.dm-card:active{border-color:#f0c469;box-shadow:0 8px 20px rgba(240,161,0,.16);transform:translateY(-1px)}
.dm-card-h{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:.2px}
.dm-card-n{font-size:18px;font-weight:800;color:var(--accent-deep);line-height:1.25}
.dm-card-d{font-size:11px;color:var(--ink-3);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dm-group{display:none}
.dm-group.win-on{display:block}
.dm-panel.win-on{display:block}
.dm-win-mask{position:fixed;inset:0;z-index:3150;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dm-win-mask.show{display:flex}
.dm-win{width:100%;max-width:860px;max-height:88vh;background:#fff;border-radius:22px;box-shadow:0 26px 70px rgba(20,32,46,.26);display:flex;flex-direction:column;overflow:hidden;transform:translateY(15px) scale(.986);opacity:0;transition:transform .26s cubic-bezier(.22,.9,.3,1),opacity .2s}
.dm-win-mask.show .dm-win{transform:none;opacity:1}
.dw-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf6,#fff);flex:none}
.dw-title{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.dw-title h3{font-size:15px;margin:0;white-space:nowrap}

.dw-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 15px 26px;background:#fff}
@media(max-width:640px){.dm-win-mask{padding:0}.dm-win{height:100%;max-height:100%;border-radius:0}.dw-body{padding:12px 12px 30px}.dm-grid{padding:11px 11px 4px;gap:9px}}
/* 全览 */
.ov-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}

.ov-perm-h span{font-size:11px;font-weight:700;background:#ffe9b8;border-radius:999px;padding:1px 7px;color:#8a5a00}
.ov-perm-list{display:flex;flex-wrap:wrap;gap:6px}
.ov-pchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink);cursor:pointer;line-height:1.5}
.ov-pchip span.dot{display:none}
.ov-pchip.done{color:var(--ink-3);text-decoration:line-through}

.ov-tree{position:relative}
.ov-year,.ov-month{position:relative}
.ov-row{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:6px 2px;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.ov-y .ov-y-label{font-size:14px;font-weight:800}
.ov-m .ov-m-label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.ov-cnt{margin-left:auto;font-size:11px;color:var(--ink-3);white-space:nowrap}

.ov-node{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}

.ov-day{border-top:1px dashed #eef2f6;padding:4px 0 6px}

.ov-d-week{font-size:11px;font-weight:500;color:var(--ink-3)}
.ov-items{display:flex;flex-direction:column;gap:3px;padding:2px 0 2px 12px}

.ov-dot{flex:none;width:7px;height:7px;border-radius:50%}

.ov-more{align-self:flex-start;border:0;background:none;color:var(--ink-3);font-size:11.5px;padding:4px 8px;cursor:pointer;text-decoration:underline;font-family:inherit}

.sr-kind.k-todo{background:#eaf3ff;color:#1f5fa8;border-color:#d5e6fb}
.sr-kind.k-record{background:#fff4e5;color:#9a5a00;border-color:#ffe2bb}
.sr-kind.k-perm{background:#f0ebff;color:#5b3fb0;border-color:#e0d7ff}
.sr-kind.k-draft{background:#f2f4f7;color:#55637a;border-color:#e3e8ef}
.sr-kind.k-bin{background:#fdeeee;color:#a33;border-color:#f7dada}
.sr-kind.k-logs{background:#eef7f0;color:#2f6b44;border-color:#d8ecdc}
.sr-text{flex:1;min-width:0;font-size:13px;color:var(--ink-1);word-break:break-word}
.sr-text.done{text-decoration:line-through;color:var(--ink-4)}
.sr-sub{flex:none;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:44%}
.sr-when{flex:none;font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.sr-jump{flex:none;height:26px;padding:0 8px;font-size:11.5px}
.sr-mark{background:var(--accent-soft);color:var(--accent-deep);border-radius:2px;padding:0 1px}
.sr-item.is-done .sr-text{text-decoration:line-through;color:var(--ink-4)}
.sr-more-tip{padding:6px;text-align:center;font-size:11.5px;color:var(--ink-4)}
.search-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-4);padding:2px 0 8px}
/* ===== v14：全览可点文字开关（去掉选择框） ===== */
.ov-toggles{display:flex;gap:6px;flex-wrap:wrap}
.ov-toggle{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink-3);font-size:12px;font-weight:700;cursor:pointer}
.ov-toggle .ov-tg-dot{width:7px;height:7px;border-radius:50%;background:#c9d2dc}
.ov-toggle.on{background:var(--accent-soft);border-color:#ffd591;color:var(--accent-deep)}
.ov-toggle.on .ov-tg-dot{background:var(--accent)}
/* ===== v14：日历独立模块 ===== */
.cal-module .module-body{padding-top:2px}
.cal-module .dm-cal-top{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.cal-module .dm-dayops{margin-top:8px}
#calMonthPill{background:var(--accent-soft);color:var(--accent-deep)}
/* ===== v13：类型芯片 / 两行折叠 / 优先级可读性 / 备份内容选择 ===== */
.filter-row{padding:2px 0 4px}
.tag-filter-bar.rec-bar{padding-top:2px}
.tag-filter-bar.rec-bar .tag-chip{background:#fff;border-color:#dde5ee}
.tag-filter-bar.rec-bar .tag-chip .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.tag-filter-bar.rec-bar .tag-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag-filter-bar.rec-bar .tag-chip.active .tdot{box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.chip-fold{flex:none;width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-2);display:none;align-items:center;justify-content:center;transition:background .15s,border-color .15s;margin:1px 0}
.chip-fold:hover{background:var(--accent-soft);border-color:#ffd591;color:var(--accent-deep)}
.chip-fold.inline{display:inline-flex;vertical-align:middle}
.chip-fold svg{transition:transform .2s}
.chip-fold.open svg{transform:rotate(180deg)}
.chip-hide{display:none!important}
.tag-filter-bar .tag-chip{white-space:nowrap}
.badge.rdate{background:#eef2f8;color:#41536a;border:1px solid #d9e2ec}
.badge.prio.high{background:#fdeaea;color:#b42318;border:1px solid #f6cdc7;font-weight:800}
.badge.prio.low{background:#ecf1f7;color:#46586b;border:1px solid #d7e0ea;font-weight:800}
.mini.high{background:#fdeaea;color:#b42318;border:1px solid #f6cdc7;font-weight:800}
.mini.low{background:#ecf1f7;color:#46586b;border:1px solid #d7e0ea;font-weight:800}
#prioSeg button.active[data-v="high"]{background:#c92a2a;color:#fff}
#prioSeg button.active[data-v="low"]{background:#557085;color:#fff}
body.dense .dm-item{padding:5px 2px}
body.dense .item-meta,body.dense .rec-meta{gap:4px;margin-bottom:1px}
body.dense .tag-filter-bar{gap:5px}
/* 备份内容选择：只保留文字与边框，不显示选择框 */
.bk-tools{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin:0 0 6px}
.bk-tools button{font-size:12px;color:var(--accent-deep);font-weight:800;padding:0 2px}
.bk-sec{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.bk-opt{font-size:12px;font-weight:600;line-height:1.5;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;transition:border-color .14s,background .14s,color .14s;white-space:nowrap}
.bk-opt:hover{border-color:#c9d6e4}
.bk-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:800}
.bk-opt small{font-weight:600;opacity:.72;margin-left:3px;font-variant-numeric:tabular-nums}
.bk-range{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 4px}
.bk-range-btn{font-size:11px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#fff}
.bk-range-btn.on{border-color:#9ec3f0;color:#1f6feb;background:#eef5ff}
.bk-hint{font-size:12px;color:var(--ink-2);line-height:1.6;margin-top:6px}
.bk-hint b{color:var(--accent-deep)}

/* ===== v15：正文宽度硬规（任何正文 ≥ 当前块 60%） ===== */
.item-content,.rec-content,.dm-content{width:100%;min-width:60%}
.dm-main{min-width:60%}
.item-main,.rec-main{min-width:60%}
.ov-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%}
.ov-txt{display:block;width:100%;min-width:60%;white-space:normal;word-break:break-word;text-align:left}
.ov-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px}
.sr-item{align-items:flex-start}
.sr-main{flex:1 1 60%;min-width:60%;display:flex;flex-direction:column;gap:2px}
.sr-line{display:flex;align-items:flex-start;gap:5px;min-width:0}
.sr-text{flex:1 1 auto;min-width:0;width:100%}
.sr-sub{flex:none;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-start;max-width:none}
.sr-badges-more{display:none;gap:4px;flex-wrap:wrap}
.sr-sub.open .sr-badges-more{display:inline-flex}
.sr-badge-more{border:1px dashed var(--line);background:#fff;cursor:pointer;font-weight:700}
.sr-sub.open .sr-badge-more{display:none}
.sr-jump{flex:none;max-width:86px;padding-left:6px;padding-right:6px}
/* ===== v15：搜索双标签组 ===== */
.sf2-taggroups{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}
.sf2-taggroup{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:5px}
.sf2-taggroup:first-child{border-top:none;padding-top:0}
.sf2-tg-h{display:flex;align-items:center;gap:6px}
.sf2-tg-name{font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.3px}
.sf2-tg-clear{margin-left:auto;height:20px;padding:0 7px;font-size:10.5px;line-height:1;border-radius:99px}
.sf2-tagbar{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start}
.sf2-tagbar .tag-chip{font-size:12px;padding:2px 8px}
.sf2-top .sf2-scope{font-weight:800}
@media (min-width:760px){.sf2-taggroups{grid-template-columns:1fr 1fr}.sf2-taggroup:nth-child(2){border-top:none;padding-top:0;border-left:1px dashed var(--line);padding-left:10px}}
#paper-entry{position:fixed;top:14px;left:14px;z-index:2147483647;width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  background:linear-gradient(135deg,#f97316,#f59e0b);
  box-shadow:0 6px 22px rgba(249,115,22,.45), inset 0 -3px 8px rgba(255,255,255,.25);
  cursor:pointer;animation:paper-breathe 2.8s ease-in-out infinite;
  transition:opacity .9s ease, transform .25s ease, box-shadow .25s ease;}
#paper-entry:hover{transform:scale(1.09);box-shadow:0 8px 26px rgba(249,115,22,.6), inset 0 -3px 8px rgba(255,255,255,.25);}
#paper-entry.fade-out{opacity:0;pointer-events:none;animation:none;}
@keyframes paper-breathe{0%,100%{opacity:.42;}50%{opacity:1;}}
